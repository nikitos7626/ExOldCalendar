<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExCalendar - Панель тренера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .admin-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card.pending {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-card.confirmed {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .stat-card p {
            opacity: 0.9;
        }
        .bookings-section h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .bookings-table {
            width: 100%;
            border-collapse: collapse;
        }
        .bookings-table th,
        .bookings-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .bookings-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        .bookings-table tr:hover {
            background: #f9f9f9;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        .status-badge.pending {
            background: #fff3e0;
            color: #ff9800;
        }
        .status-badge.confirmed {
            background: #e3f2fd;
            color: #2196f3;
        }
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .action-btn.cancel {
            background: #ff5252;
            color: white;
        }
        .action-btn.cancel:hover {
            background: #ff1744;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📘 Панель тренера</h1>
            <p>Управление записями на тренировки</p>
        </div>
        
        <div class="admin-panel">
            <div class="stats">
                <div class="stat-card pending">
                    <h3 id="pending-count">0</h3>
                    <p>Ожидают подтверждения</p>
                </div>
                <div class="stat-card confirmed">
                    <h3 id="confirmed-count">0</h3>
                    <p>Подтверждено</p>
                </div>
                <div class="stat-card">
                    <h3 id="total-count">0</h3>
                    <p>Всего записей</p>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="loadBookings()">🔄 Обновить</button>
            
            <div class="bookings-section">
                <h2>📋 Все активные записи</h2>
                <div id="bookings-container">
                    <div class="loading">Загрузка записей...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadBookings() {
            try {
                const response = await fetch('/api/bookings');
                const bookings = await response.json();
                
                const container = document.getElementById('bookings-container');
                
                // Обновляем статистику
                document.getElementById('pending-count').textContent = 
                    bookings.filter(b => b.status === 'pending').length;
                document.getElementById('confirmed-count').textContent = 
                    bookings.filter(b => b.status === 'confirmed').length;
                document.getElementById('total-count').textContent = bookings.length;
                
                if (bookings.length === 0) {
                    container.innerHTML = '<div class="empty-state">Нет активных записей</div>';
                    return;
                }
                
                let html = `
                    <table class="bookings-table">
                        <thead>
                            <tr>
                                <th>Дата</th>
                                <th>Время</th>
                                <th>Клиент</th>
                                <th>Telegram</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for (const booking of bookings) {
                    const dateObj = new Date(booking.date);
                    const dateStr = dateObj.toLocaleDateString('ru-RU', { 
                        weekday: 'long',
                        day: 'numeric',
                        month: 'long'
                    });
                    
                    const statusClass = booking.status === 'pending' ? 'pending' : 'confirmed';
                    const statusText = booking.status === 'pending' ? 'Ожидает' : 'Подтверждено';
                    
                    html += `
                        <tr>
                            <td>${dateStr}</td>
                            <td>${booking.time}</td>
                            <td>${booking.client}</td>
                            <td>${booking.username || '-'}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="action-btn cancel" onclick="cancelBooking('${booking.id}')">
                                    ❌ Отменить
                                </button>
                            </td>
                        </tr>
                    `;
                }
                
                html += '</tbody></table>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('bookings-container').innerHTML = 
                    '<div class="loading">Ошибка загрузки записей</div>';
            }
        }
        
        async function cancelBooking(bookingId) {
            if (!confirm('Вы уверены, что хотите отменить эту запись?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/cancel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ booking_id: bookingId })
                });
                
                if (response.ok) {
                    alert('Запись отменена');
                    loadBookings();
                } else {
                    alert('Ошибка при отмене записи');
                }
            } catch (error) {
                console.error('Error cancelling booking:', error);
                alert('Ошибка при отмене записи');
            }
        }
        
        // Загружаем при загрузке страницы
        loadBookings();
        
        // Обновляем каждые 15 секунд
        setInterval(loadBookings, 15000);
    </script>
</body>
</html>

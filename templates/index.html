<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExCalendar - Запись на тренировки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .calendar {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header h2 {
            color: #333;
        }
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .slot {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e0e0e0;
        }
        .slot:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .slot.free {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .slot.free:hover {
            background: #c8e6c9;
        }
        .slot.pending {
            background: #fff3e0;
            border-color: #ff9800;
            cursor: not-allowed;
        }
        .slot.confirmed {
            background: #e3f2fd;
            border-color: #2196f3;
            cursor: not-allowed;
        }
        .slot .date {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .slot .time {
            color: #666;
            font-size: 0.9em;
        }
        .slot .status {
            margin-top: 5px;
            font-size: 0.8em;
            padding: 3px 8px;
            border-radius: 5px;
            display: inline-block;
        }
        .slot.free .status {
            background: #4caf50;
            color: white;
        }
        .slot.pending .status {
            background: #ff9800;
            color: white;
        }
        .slot.confirmed .status {
            background: #2196f3;
            color: white;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 5px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏋️ ExCalendar</h1>
            <p>Запись на индивидуальные тренировки</p>
        </div>
        
        <div class="calendar">
            <div class="calendar-header">
                <h2>📅 Доступные слоты</h2>
            </div>
            
            <div id="slots-container">
                <div class="loading">Загрузка слотов...</div>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #c8e6c9; border: 2px solid #4caf50;"></div>
                    <span>Свободно</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffe0b2; border: 2px solid #ff9800;"></div>
                    <span>Ожидает</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #bbdefb; border: 2px solid #2196f3;"></div>
                    <span>Подтверждено</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadSlots() {
            try {
                const response = await fetch('/api/slots');
                const slots = await response.json();
                
                const container = document.getElementById('slots-container');
                
                if (slots.length === 0) {
                    container.innerHTML = '<div class="loading">Нет доступных слотов</div>';
                    return;
                }
                
                let html = '<div class="slots-grid">';
                
                for (const slot of slots) {
                    const dateObj = new Date(slot.date);
                    const dayName = dateObj.toLocaleDateString('ru-RU', { weekday: 'short' });
                    const dayMonth = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                    
                    let statusText = '';
                    if (slot.status === 'free') statusText = 'Свободно';
                    else if (slot.status === 'pending') statusText = 'Ожидает';
                    else if (slot.status === 'confirmed') statusText = 'Подтверждено';
                    
                    html += `
                        <div class="slot ${slot.status}">
                            <div class="date">${dayName}, ${dayMonth}</div>
                            <div class="time">${slot.time}</div>
                            <div class="status">${statusText}</div>
                        </div>
                    `;
                }
                
                html += '</div>';
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading slots:', error);
                document.getElementById('slots-container').innerHTML = 
                    '<div class="loading">Ошибка загрузки слотов</div>';
            }
        }
        
        // Загружаем слоты при загрузке страницы
        loadSlots();
        
        // Обновляем каждые 30 секунд
        setInterval(loadSlots, 30000);
    </script>
</body>
</html>
